function toSegments(stages) {
  const sorted = [...stages].sort((a, b) => a - b);
  const segs = [];
  let cur = [sorted[0]];
  for (let i = 1; i < sorted.length; i++) {
    if (sorted[i] === sorted[i - 1] + 1) { cur.push(sorted[i]); }
    else { segs.push(cur); cur = [sorted[i]]; }
  }
  segs.push(cur);
  return segs;
}

const TOOL_TO_PROVIDER = {};
Object.entries(PROVIDER_TOOLS).forEach(([p, tools]) => { tools.forEach((t) => { TOOL_TO_PROVIDER[t] = p; }); });

const INDEPENDENT_LABEL = "Independent / single-tool providers";

const TOOLS = RAW_TOOLS.map(([name, description, stages], idx) => {
  const provider = TOOL_TO_PROVIDER[name] || name;
  return { id: `tool-${idx}`, name, description, stages, segments: toSegments(stages), provider, isIndependent: !TOOL_TO_PROVIDER[name] };
});

const PROVIDERS = Array.from(new Set(TOOLS.map((t) => t.provider))).sort((a, b) => {
  const ca = TOOLS.filter((t) => t.provider === a).length;
  const cb = TOOLS.filter((t) => t.provider === b).length;
  return ca !== cb ? cb - ca : a.localeCompare(b);
});

function displayGroupFor(t) { return t.isIndependent ? INDEPENDENT_LABEL : t.provider; }

function byPhaseOrder(a, b) {
  const af = a.stages[0], bf = b.stages[0];
  if (af !== bf) return af - bf;
  const al = a.stages[a.stages.length - 1], bl = b.stages[b.stages.length - 1];
  if (al !== bl) return al - bl;
  return a.name.localeCompare(b.name);
}

            </div>
            <div style={{ fontFamily: "var(--font-mono)", fontSize: 9, color: active ? "hsl(var(--pure-blue-500) / 0.7)" : "hsl(var(--ink-900) / 0.2)", marginTop: 2 }}>
              {stageCounts[s.id]}
            </div>
          </button>
        );
      })}
    </div>
  );
}

function ColumnHighlights({ stageFilter, colLabelW, colW }) {
  if (stageFilter.size === 0) return null;
  return (
    <div aria-hidden="true" style={{
      position: "absolute", top: 0, left: colLabelW, right: 0, bottom: 0,
      pointerEvents: "none", zIndex: 0,
      transition: "left 140ms var(--ease-standard)",
    }}>
      {STAGES.map((s) => !stageFilter.has(s.id) ? null : (
        <div key={s.id} style={{
          position: "absolute", top: 0, bottom: 0,
          left: (s.id - 1) * colW, width: colW,
          background: "hsl(var(--pure-blue-500) / 0.04)",
        }} />
      ))}
    </div>
  );
}

function ToolRow({ tool, isOpen, onToggle, highlight, colLabelW, colW, rowH, compact }) {
  const dotR   = compact ? 2.5 : 3.5;
  const strokeW = compact ? 1 : 1.25;

  return (
    <div>
      <div
        onClick={onToggle}
        title={compact ? tool.name : undefined}
        style={{
          display: "flex", alignItems: "center",
          height: rowH, cursor: "pointer",
          background: isOpen ? "hsl(var(--vellum-200) / 0.55)" : "transparent",
          borderBottom: "1px solid hsl(var(--vellum-200))",
          transition: "background var(--duration-fast) var(--ease-standard)",
        }}
        onMouseEnter={(e) => { if (!isOpen) e.currentTarget.style.background = "hsl(var(--ink-900) / 0.025)"; }}
        onMouseLeave={(e) => { e.currentTarget.style.background = isOpen ? "hsl(var(--vellum-200) / 0.55)" : "transparent"; }}
      >
        {/* Label column */}
        <div style={{
          width: colLabelW, flexShrink: 0, boxSizing: "border-box",
          padding: compact ? "0 0 0 6px" : "0 12px 0 10px",
          display: "flex", alignItems: "center", gap: 7,
          overflow: "hidden",
          transition: "width 140ms var(--ease-standard), padding 140ms var(--ease-standard)",
        }}>
          <span style={{
            fontFamily: "var(--font-mono)", fontSize: 8,
            color: highlight ? "hsl(var(--pure-blue-500))" : "hsl(var(--ink-900) / 0.22)",
            width: 8, flexShrink: 0,
            transform: isOpen ? "rotate(90deg)" : "none",
            transition: "transform 120ms var(--ease-standard), color var(--duration-fast) var(--ease-standard)",
          }}>&#9656;</span>
          {!compact && (
            <span style={{
              fontFamily: "var(--font-legible)", fontSize: 13,
              color: highlight ? "hsl(var(--pure-blue-500))" : "hsl(var(--ink-900))",
              fontWeight: highlight ? 500 : 400,
              whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis",
              letterSpacing: "-0.01em",
            }} title={tool.name}>
              {tool.name}
            </span>
          )}
        </div>

        {/* Dots column */}
        <div style={{ position: "relative", height: rowH, flex: 1 }}>
          <svg
            width={STAGES.length * colW}
            height={rowH}
            style={{ position: "absolute", left: 0, top: 0, overflow: "visible" }}
          >
            {tool.segments.map((seg, i) => {
              const dotFill = highlight ? T.blue : T.ink;
              if (seg.length === 1) {
                const cx = (seg[0] - 1) * colW + colW / 2;
                return <circle key={i} cx={cx} cy={rowH / 2} r={dotR} fill={dotFill} />;
              }
              const x1 = (seg[0] - 1) * colW + colW / 2;
              const x2 = (seg[seg.length - 1] - 1) * colW + colW / 2;
              return (
                <g key={i}>
                  <line x1={x1} y1={rowH / 2} x2={x2} y2={rowH / 2}
                    stroke={highlight ? T.blue : T.connector} strokeWidth={strokeW} />
                  {seg.map((s) => (
                    <circle key={s} cx={(s - 1) * colW + colW / 2} cy={rowH / 2} r={dotR} fill={dotFill} />
                  ))}
                </g>
              );
            })}
          </svg>
        </div>
      </div>

      {isOpen && (
        <div style={{
          paddingTop: 10, paddingBottom: 14,
          paddingLeft: Math.max(colLabelW - 4, 20),
          paddingRight: 20,
          background: "hsl(var(--vellum-100))",
          borderBottom: "1px solid hsl(var(--vellum-200))",
        }}>
          {compact && (
            <p style={{ fontFamily: "var(--font-legible)", fontSize: 13, fontWeight: 600, color: "hsl(var(--ink-900))", margin: "0 0 8px", letterSpacing: "-0.01em" }}>
              {tool.name}
            </p>
          )}
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 8, alignItems: "center" }}>
            <span style={{
              fontFamily: "var(--font-legible)", fontSize: 11, fontWeight: 400,
              color: "hsl(var(--ink-900) / 0.55)",
              background: "hsl(var(--vellum-300))",
              borderRadius: "var(--radius-sm)", padding: "2px 8px",
            }}>{tool.provider}</span>
            {tool.stages.map((s, i) => (
              <span key={s} style={{
                fontFamily: "var(--font-mono)", fontSize: 10,
                color: "hsl(var(--ink-900) / 0.35)",
              }}>
                {STAGES.find((x) => x.id === s).short}{i < tool.stages.length - 1 ? " ·" : ""}
              </span>
            ))}
          </div>
          <p style={{
            fontFamily: "var(--font-legible)", fontSize: 13, fontWeight: 300,
            lineHeight: 1.6, color: "hsl(var(--ink-900) / 0.7)",
            margin: 0, maxWidth: 600,
          }}>{tool.description}</p>
        </div>
      )}
    </div>
  );
}

function ProviderGroup({ provider, tools, defaultCollapsed, openRows, toggleRow, colLabelW, colW, rowH, compact }) {
  const [collapsed, setCollapsed] = useState(defaultCollapsed);
  useEffect(() => { setCollapsed(defaultCollapsed); }, [defaultCollapsed, provider]);

  return (
    <div>
      <div onClick={() => setCollapsed(!collapsed)} style={{
        display: "flex", alignItems: "center", gap: 8, height: 32,
        background: "hsl(var(--vellum-200))",
        borderTop: "1px solid hsl(var(--vellum-300))",
        borderBottom: "1px solid hsl(var(--vellum-300))",
        cursor: "pointer", padding: "0 12px",
        position: "sticky", top: HEADER_H, zIndex: 2,
      }}>
        <span style={{
          fontFamily: "var(--font-mono)", fontSize: 8,
          color: "hsl(var(--ink-900) / 0.3)",
          transform: collapsed ? "none" : "rotate(90deg)",
          transition: "transform 120ms var(--ease-standard)",
        }}>&#9656;</span>
        <span style={{ fontFamily: "var(--font-legible)", fontSize: 12.5, fontWeight: 700, color: "hsl(var(--ink-900) / 0.75)", letterSpacing: "-0.01em" }}>
          {provider}
        </span>
        <span style={{ fontFamily: "var(--font-mono)", fontSize: 10, color: "hsl(var(--ink-900) / 0.3)" }}>
          {tools.length} {tools.length === 1 ? "tool" : "tools"}
        </span>
      </div>
      {!collapsed && tools.map((tool) => (
        <ToolRow key={tool.id} tool={tool}
          isOpen={!!openRows[tool.id]} onToggle={() => toggleRow(tool.id)}
          highlight={false} colLabelW={colLabelW} colW={colW} rowH={rowH} compact={compact}
        />
      ))}
    </div>
  );
}

// ---------- Main component ----------

function ToolLandscape() {
  const [query, setQuery]               = useState("");
  const [stageFilter, setStageFilter]   = useState(() => new Set());
  const [providerFilter, setProviderFilter] = useState("all");
  const [groupByProvider, setGroupByProvider] = useState(false);
  const [openRows, setOpenRows]         = useState({});
  const [density, setDensity]           = useState("relaxed");
  const isCompact  = density === "compact";
  const colLabelW  = isCompact ? COL_LABEL_W_COMPACT : COL_LABEL_W_RELAXED;
  const rowH       = isCompact ? ROW_H_COMPACT : ROW_H_RELAXED;

  const tableRef = React.useRef(null);
  const [colW, setColW] = useState(COL_STAGE_W);

  useEffect(() => {
    const el = tableRef.current;
    if (!el) return;
    const update = () => {
      const avail = el.clientWidth - colLabelW;
      if (avail > 0) setColW(Math.max(COL_STAGE_W, avail / STAGES.length));
    };
    update();
    const ro = new ResizeObserver(update);
    ro.observe(el);
    return () => ro.disconnect();
  }, [colLabelW]);

  const toggleRow = (id) => setOpenRows((p) => ({ ...p, [id]: !p[id] }));
  const toggleStage = (id) => setStageFilter((p) => {
    const n = new Set(p);
    n.has(id) ? n.delete(id) : n.add(id);
    return n;
  });

  const filtered = useMemo(() => TOOLS.filter((t) => {
    if (query && !t.name.toLowerCase().includes(query.toLowerCase())) return false;
    if (stageFilter.size > 0 && !t.stages.some((s) => stageFilter.has(s))) return false;
    if (providerFilter !== "all" && t.provider !== providerFilter) return false;
    return true;
  }).sort(byPhaseOrder), [query, stageFilter, providerFilter]);

  const grouped = useMemo(() => {
    const map = {};
    filtered.forEach((t) => { const k = displayGroupFor(t); if (!map[k]) map[k] = []; map[k].push(t); });
    return Object.entries(map).sort((a, b) => {
      if (a[0] === INDEPENDENT_LABEL) return 1;
      if (b[0] === INDEPENDENT_LABEL) return -1;
      if (a[1].length !== b[1].length) return b[1].length - a[1].length;
      return a[0].localeCompare(b[0]);
    });
  }, [filtered]);

  const stageCounts = useMemo(() => {
    const c = {};
    STAGES.forEach((s) => { c[s.id] = TOOLS.filter((t) => t.stages.includes(s.id)).length; });
    return c;
  }, []);

  const hasFilters = query || stageFilter.size > 0 || providerFilter !== "all";

  // ---- Input shared styles ----
  const inputStyle = {
    fontFamily: "var(--font-legible)",
    fontSize: 12.5, fontWeight: 400,
    padding: "5px 10px",
    border: "1px solid hsl(var(--vellum-300))",
    borderRadius: "var(--radius-md)",
    background: "hsl(var(--vellum-50))",
    color: "hsl(var(--ink-900))",
    outline: "none",
    transition: "border-color var(--duration-fast) var(--ease-standard)",
  };

  return (
    <div style={{
      height: "100%", display: "flex", flexDirection: "column",
      overflow: "hidden",
      background: "hsl(var(--vellum-50))",
      color: "hsl(var(--ink-900))",
      fontFamily: "var(--font-legible)",
      borderRadius: "var(--radius-lg)",
      border: "1px solid hsl(var(--vellum-300))",
    }}>

      {/* ---- Controls header ---- */}
      <div style={{ padding: "14px 18px 12px", borderBottom: "1px solid hsl(var(--vellum-200))", flexShrink: 0 }}>
        <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 10 }}>
          <div>
            <h1 style={{ fontFamily: "var(--font-legible)", fontSize: 15, fontWeight: 700, margin: 0, color: "hsl(var(--ink-900))", letterSpacing: "-0.02em" }}>
              Bible translation tool landscape
            </h1>
            <p style={{ fontFamily: "var(--font-legible)", fontSize: 12, fontWeight: 300, color: "hsl(var(--ink-900) / 0.5)", margin: "2px 0 0" }}>
              {TOOLS.length} tools across {PROVIDERS.length} providers, mapped to the 7-stage translation pipeline
            </p>
          </div>
          <span style={{ fontFamily: "var(--font-mono)", fontSize: 10.5, color: "hsl(var(--ink-900) / 0.28)", flexShrink: 0, marginLeft: 16 }}>
            {filtered.length} shown
          </span>
        </div>

        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
          {/* Search */}
          <input type="text" placeholder="Search tool name…" value={query}
            onChange={(e) => setQuery(e.target.value)}
            style={{ ...inputStyle, width: 180 }}
          />

          {/* Provider filter */}
          <select value={providerFilter} onChange={(e) => setProviderFilter(e.target.value)}
            style={{ ...inputStyle, paddingRight: 6, cursor: "pointer", flex: "1 1 180px", maxWidth: 280 }}
          >
            <option value="all">All providers</option>
            {PROVIDERS.map((p) => (
              <option key={p} value={p}>{p} ({TOOLS.filter((t) => t.provider === p).length})</option>
            ))}
          </select>

          {/* Group by provider */}
          <label style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 12, color: "hsl(var(--ink-900) / 0.55)", cursor: "pointer", whiteSpace: "nowrap", userSelect: "none" }}>
            <input type="checkbox" checked={groupByProvider} onChange={(e) => setGroupByProvider(e.target.checked)} />
            Group by provider
          </label>

          {/* Density toggle */}
          <div style={{ display: "flex", border: "1px solid hsl(var(--vellum-300))", borderRadius: 999, overflow: "hidden", flexShrink: 0 }}>
            {["relaxed", "compact"].map((d) => (
              <button key={d} onClick={() => setDensity(d)} aria-pressed={density === d}
                style={{
                  fontFamily: "var(--font-legible)", fontSize: 11.5, fontWeight: density === d ? 500 : 400,
                  padding: "4px 12px", border: "none",
                  background: density === d ? "hsl(var(--ink-950))" : "transparent",
                  color: density === d ? "hsl(var(--vellum-50))" : "hsl(var(--ink-900) / 0.5)",
                  cursor: "pointer",
                  transition: "background var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard)",
                }}
              >{d === "relaxed" ? "Relaxed" : "Compact"}</button>
            ))}
          </div>

          {/* Clear filters */}
          {hasFilters && (
            <button onClick={() => { setQuery(""); setStageFilter(new Set()); setProviderFilter("all"); }}
              style={{
                fontFamily: "var(--font-legible)", fontSize: 11.5, fontWeight: 400,
                color: "hsl(var(--ink-900) / 0.5)",
                background: "transparent", border: "1px solid hsl(var(--vellum-300))",
                borderRadius: 999, padding: "4px 12px", cursor: "pointer",
                transition: "border-color var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard)",
              }}
              onMouseEnter={(e) => { e.currentTarget.style.borderColor = "hsl(var(--ink-900) / 0.35)"; e.currentTarget.style.color = "hsl(var(--ink-900))"; }}
              onMouseLeave={(e) => { e.currentTarget.style.borderColor = "hsl(var(--vellum-300))"; e.currentTarget.style.color = "hsl(var(--ink-900) / 0.5)"; }}
            >Clear filters</button>
          )}
        </div>
      </div>

      {/* ---- Table (scrolls) ---- */}
      <div ref={tableRef} style={{ flex: 1, overflowY: "auto", overflowX: "auto", position: "relative" }}>
        <div style={{ minWidth: colLabelW + STAGES.length * colW, position: "relative" }}>
          <ColumnHighlights stageFilter={stageFilter} colLabelW={colLabelW} colW={colW} />
          <StageHeader stageFilter={stageFilter} toggleStage={toggleStage} stageCounts={stageCounts} colLabelW={colLabelW} colW={colW} />

          {filtered.length === 0 && (
            <div style={{ padding: "40px 20px", textAlign: "center", fontFamily: "var(--font-legible)", fontSize: 13, color: "hsl(var(--ink-900) / 0.35)" }}>
              No tools match the current filters.
            </div>
          )}

          {groupByProvider
            ? grouped.map(([provider, tools]) => (
                <ProviderGroup key={provider} provider={provider} tools={tools}
                  defaultCollapsed={provider === "SIL" || provider === INDEPENDENT_LABEL}
                  openRows={openRows} toggleRow={toggleRow}
                  colLabelW={colLabelW} colW={colW} rowH={rowH} compact={isCompact}
                />
              ))
            : filtered.map((tool) => (
                <ToolRow key={tool.id} tool={tool}
                  isOpen={!!openRows[tool.id]} onToggle={() => toggleRow(tool.id)}
                  highlight={false} colLabelW={colLabelW} colW={colW} rowH={rowH} compact={isCompact}
                />
              ))
          }
        </div>
      </div>

      {/* ---- Legend ---- */}
      <div style={{
        padding: "7px 18px", borderTop: "1px solid hsl(var(--vellum-200))",
        display: "flex", gap: 16, flexShrink: 0,
        fontFamily: "var(--font-mono)", fontSize: 10, color: "hsl(var(--ink-900) / 0.28)",
      }}>
        <span>&#9679; single-stage</span>
        <span>&#9679;&#8212;&#9679; contiguous span</span>
        <span>&#9679;&nbsp;&nbsp;&#9679; non-contiguous</span>
        <span style={{ marginLeft: "auto", fontFamily: "var(--font-legible)", fontWeight: 300 }}>click stage header to filter</span>
      </div>
    </div>
  );
}

try {
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(React.createElement(ToolLandscape));
} catch (e) {
  showError('Failed to render component: ' + e.message, e.stack);
}
</script>

</body>
</html>
