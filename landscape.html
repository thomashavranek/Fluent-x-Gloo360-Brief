function toSegments(stages) {
  const sorted = [...stages].sort((a, b) => a - b);
  const segments = [];
  let current = [sorted[0]];
  for (let i = 1; i < sorted.length; i++) {
    if (sorted[i] === sorted[i - 1] + 1) {
      current.push(sorted[i]);
    } else {
      segments.push(current);
      current = [sorted[i]];
    }
  }
  segments.push(current);
  return segments;
}

const TOOL_TO_PROVIDER = {};
Object.entries(PROVIDER_TOOLS).forEach(([provider, tools]) => {
  tools.forEach((t) => { TOOL_TO_PROVIDER[t] = provider; });
});

const INDEPENDENT_LABEL = "Independent / single-tool providers";

const TOOLS = RAW_TOOLS.map(([name, description, stages], idx) => {
  const isIndependent = !TOOL_TO_PROVIDER[name];
  const provider = TOOL_TO_PROVIDER[name] || name;
  return {
    id: `tool-${idx}`,
    name,
    description,
    stages,
    segments: toSegments(stages),
    provider,
    isIndependent,
  };
});

// For the provider filter dropdown, list real multi-tool providers individually
// plus each independent tool by its own name (so search/filter still finds it),
// but for grouped-view display, independent tools collapse into one bucket
// rather than each rendering as its own single-row provider band.
const PROVIDERS = Array.from(new Set(TOOLS.map((t) => t.provider))).sort((a, b) => {
  const countA = TOOLS.filter((t) => t.provider === a).length;
  const countB = TOOLS.filter((t) => t.provider === b).length;
  if (countA !== countB) return countB - countA;
  return a.localeCompare(b);
});

function displayGroupFor(tool) {
  return tool.isIndependent ? INDEPENDENT_LABEL : tool.provider;
}

// Sort tools left-to-right along the translation spectrum:
// 1. earliest stage touched (stages are pre-sorted ascending at construction)
// 2. narrower span first among ties (a tool starting and ending at stage 1
//    sorts before one that starts at 1 but stretches all the way to 7)
// 3. latest stage touched, as a further tiebreak
// 4. alphabetical, for full determinism
function byPhaseOrder(a, b) {
  const aFirst = a.stages[0];
  const bFirst = b.stages[0];
  if (aFirst !== bFirst) return aFirst - bFirst;

  const aLast = a.stages[a.stages.length - 1];
  const bLast = b.stages[b.stages.length - 1];
  if (aLast !== bLast) return aLast - bLast;

  return a.name.localeCompare(b.name);
}

  return (
    <div

      style={{
        position: "absolute",
        top: 0,
        left: colLabelW,
        right: 0,
        bottom: 0,
        pointerEvents: "none",
        zIndex: 0,
        transition: "left 140ms ease",
      }}
    >
      {STAGES.map((s) => {
        if (!stageFilter.has(s.id)) return null;
        return (
          <div

            style={{
              position: "absolute",
              top: 0,
              bottom: 0,
              left: (s.id - 1) * colW,
              width: colW,
              background: "var(--col-highlight)",
            }}
          />
        );
      })}

  );
}

        title={compact ? tool.name : undefined}
        style={{
          display: "flex",
          alignItems: "center",
          height: rowH,
          cursor: "pointer",
          background: isOpen ? "var(--row-open)" : "transparent",
          borderBottom: compact ? "1px solid var(--rule-faint)" : "1px solid var(--rule-faint)",
        }}
        onMouseEnter={(e) => { if (!isOpen) e.currentTarget.style.background = "var(--row-hover)"; }}
        onMouseLeave={(e) => { if (!isOpen) e.currentTarget.style.background = "transparent"; }}
      >
        <div
          style={{
            width: colLabelW,
            flexShrink: 0,
            padding: compact ? "0 0 0 6px" : "0 10px 0 8px",
            display: "flex",
            alignItems: "center",
            gap: 6,
            overflow: "hidden",
            transition: "width 140ms ease, padding 140ms ease",
          }}
        >
          <span
            style={{
              fontFamily: "var(--mono)",
              fontSize: 9,
              color: highlight ? "var(--fluent)" : "var(--ink-faint)",
              width: 10,
              flexShrink: 0,
              transform: isOpen ? "rotate(90deg)" : "none",
              transition: "transform 120ms ease",
            }}
          >
            &#9656;
          </span>
          {!compact && (
            <span
              style={{
                fontFamily: "var(--mono)",
                fontSize: 12.5,
                color: highlight ? "var(--fluent)" : "var(--ink)",
                fontWeight: highlight ? 500 : 400,
                whiteSpace: "nowrap",
                overflow: "hidden",
                textOverflow: "ellipsis",
              }}
              title={tool.name}
            >
              {tool.name}
            </span>
          )}
        </div>

        <div style={{ position: "relative", height: rowH, flex: 1 }}>
          <svg
            width={STAGES.length * colW}
            height={rowH}
            style={{ position: "absolute", left: 0, top: 0, overflow: "visible" }}
          >
            {tool.segments.map((seg, i) => {
              if (seg.length === 1) {
                const cx = (seg[0] - 1) * colW + colW / 2;
                return (
                  <circle
                    key={i}
                    cx={cx}
                    cy={rowH / 2}
                    r={dotR}
                    fill={highlight ? "var(--fluent)" : "var(--ink)"}
                  />
                );
              }
              const x1 = (seg[0] - 1) * colW + colW / 2;
              const x2 = (seg[seg.length - 1] - 1) * colW + colW / 2;
              return (
                <g key={i}>
                  <line
                    x1={x1}
                    y1={rowH / 2}
                    x2={x2}
                    y2={rowH / 2}
                    stroke={highlight ? "var(--fluent)" : "var(--connector)"}
                    strokeWidth={strokeW}
                  />
                  {seg.map((s) => (
                    <circle
                      key={s}
                      cx={(s - 1) * colW + colW / 2}
                      cy={rowH / 2}
                      r={dotR}
                      fill={highlight ? "var(--fluent)" : "var(--ink)"}
                    />
                  ))}
                </g>
              );
            })}
          </svg>
        </div>
      </div>

      {isOpen && (
        <div
          style={{
            padding: "10px 16px 14px",
            paddingLeft: Math.max(colLabelW - 4, 16),
            background: "var(--row-open)",
            borderBottom: "1px solid var(--rule-faint)",
            fontFamily: "var(--sans)",
          }}
        >
          {compact && (
            <p
              style={{
                fontFamily: "var(--mono)",
                fontSize: 13,
                fontWeight: 500,
                color: highlight ? "var(--fluent)" : "var(--ink)",
                margin: "0 0 6px",
              }}
            >
              {tool.name}
            </p>
          )}
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 6, maxWidth: 620 }}>
            <span
              style={{
                fontFamily: "var(--mono)",
                fontSize: 10.5,
                color: "var(--ink-soft)",
                border: "1px solid var(--rule)",
                borderRadius: 3,
                padding: "2px 7px",
              }}
            >
              {tool.provider}
            </span>
            {tool.stages.map((s) => (
              <span
                key={s}
                style={{
                  fontFamily: "var(--mono)",
                  fontSize: 10.5,
                  color: "var(--ink-faint)",
                }}
              >
                {STAGES.find((x) => x.id === s).short}
                {s !== tool.stages[tool.stages.length - 1] ? " ·" : ""}
              </span>
            ))}
          </div>
          <p style={{ fontSize: 13, lineHeight: 1.55, color: "var(--ink)", margin: 0, maxWidth: 620 }}>
            {tool.description}
          </p>
        </div>
      )}
    </div>
  );
}

function ProviderGroup({ provider, tools, defaultCollapsed, openRows, toggleRow, colLabelW, colW, rowH, compact }) {
  const [collapsed, setCollapsed] = useState(defaultCollapsed);

  useEffect(() => {
    setCollapsed(defaultCollapsed);
  }, [defaultCollapsed, provider]);

  return (
    <div>
      <div
        onClick={() => setCollapsed(!collapsed)}
        style={{
          display: "flex",
          alignItems: "center",
          gap: 8,
          height: 34,
          background: "var(--group-band)",
          borderTop: "1px solid var(--rule)",
          borderBottom: "1px solid var(--rule)",
          cursor: "pointer",
          padding: "0 10px",
          position: "sticky",
          top: HEADER_H,
          zIndex: 2,
        }}
      >
        <span
          style={{
            fontFamily: "var(--mono)",
            fontSize: 9,
            color: "var(--ink-faint)",
            transform: collapsed ? "none" : "rotate(90deg)",
            transition: "transform 120ms ease",
          }}
        >
          &#9656;
        </span>
        <span style={{ fontFamily: "var(--serif)", fontSize: 13.5, fontWeight: 600, color: "var(--ink)" }}>
          {provider}
        </span>
        <span style={{ fontFamily: "var(--mono)", fontSize: 11, color: "var(--ink-faint)" }}>
          {tools.length} {tools.length === 1 ? "tool" : "tools"}
        </span>
      </div>
      {!collapsed &&
        tools.map((tool) => (
          <ToolRow
            key={tool.id}
            tool={tool}
            isOpen={!!openRows[tool.id]}
            onToggle={() => toggleRow(tool.id)}
            highlight={false}
            colLabelW={colLabelW}
            colW={colW}
            rowH={rowH}
            compact={compact}
          />
        ))}
    </div>
  );
}

function ToolLandscape() {
  const [query, setQuery] = useState("");
  const [stageFilter, setStageFilter] = useState(() => new Set());
  const [providerFilter, setProviderFilter] = useState("all");
  const [groupByProvider, setGroupByProvider] = useState(false);
  const [openRows, setOpenRows] = useState({});
  const [density, setDensity] = useState("relaxed");
  const isCompact = density === "compact";
  const colLabelW = isCompact ? COL_LABEL_W_COMPACT : COL_LABEL_W_RELAXED;
  const rowH = isCompact ? ROW_H_COMPACT : ROW_H_RELAXED;

  const tableRef = React.useRef(null);
  const [colW, setColW] = useState(COL_STAGE_W);

  useEffect(() => {
    const el = tableRef.current;
    if (!el) return;
    const update = () => {
      const available = el.clientWidth - colLabelW;
      if (available > 0) setColW(Math.max(COL_STAGE_W, available / STAGES.length));
    };
    update();
    const ro = new ResizeObserver(update);
    ro.observe(el);
    return () => ro.disconnect();
  }, [colLabelW]);

  const toggleRow = (id) => setOpenRows((prev) => ({ ...prev, [id]: !prev[id] }));

  const toggleStage = (stageId) => {
    setStageFilter((prev) => {
      const next = new Set(prev);
      if (next.has(stageId)) next.delete(stageId);
      else next.add(stageId);
      return next;
    });
  };

  const filtered = useMemo(() => {
    return TOOLS.filter((t) => {
      if (query && !t.name.toLowerCase().includes(query.toLowerCase())) return false;
      if (stageFilter.size > 0 && !t.stages.some((s) => stageFilter.has(s))) return false;
      if (providerFilter !== "all" && t.provider !== providerFilter) return false;
      return true;
    }).sort(byPhaseOrder);
  }, [query, stageFilter, providerFilter]);

  const grouped = useMemo(() => {
    const map = {};
    filtered.forEach((t) => {
      const groupKey = displayGroupFor(t);
      if (!map[groupKey]) map[groupKey] = [];
      map[groupKey].push(t);
    });
    // filtered is already phase-sorted, so tools within each group inherit
    // that order automatically — no separate sort needed here.
    return Object.entries(map).sort((a, b) => {
      if (a[0] === INDEPENDENT_LABEL) return 1;
      if (b[0] === INDEPENDENT_LABEL) return -1;
      if (a[1].length !== b[1].length) return b[1].length - a[1].length;
      return a[0].localeCompare(b[0]);
    });
  }, [filtered]);

  const stageCounts = useMemo(() => {
    const counts = {};
    STAGES.forEach((s) => {
      counts[s.id] = TOOLS.filter((t) => t.stages.includes(s.id)).length;
    });
    return counts;
  }, []);

  return (
    <div
      style={{
        "--paper": "#F9F7F3",
        "--ink": "#1A1614",
        "--ink-soft": "#5A5148",
        "--ink-faint": "#9A9088",
        "--rule": "#DDD8CC",
        "--rule-faint": "#E8E4DA",
        "--connector": "#8B6F47",
        "--fluent": "#3b74f6",
        "--row-hover": "rgba(139, 111, 71, 0.06)",
        "--row-open": "rgba(139, 111, 71, 0.10)",
        "--group-band": "#EDE9E0",
        "--col-highlight": "rgba(59, 116, 246, 0.06)",
        "--serif": "var(--font-legible, 'Inter', sans-serif)",
        "--mono": "'JetBrains Mono', 'SF Mono', Menlo, monospace",
        "--sans": "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif",
        background: "var(--paper)",
        color: "var(--ink)",
        fontFamily: "var(--sans)",
        borderRadius: 8,
        border: "1px solid var(--rule)",
        overflow: "hidden",
      }}
    >

      <div style={{ padding: "18px 20px 14px", borderBottom: "1px solid var(--rule)" }}>
        <h1 style={{ fontFamily: "var(--serif)", fontSize: 20, fontWeight: 600, margin: 0, color: "var(--ink)" }}>
          Bible translation tool landscape
        </h1>
        <p style={{ fontSize: 12.5, color: "var(--ink-soft)", margin: "4px 0 0" }}>
          {TOOLS.length} tools across {PROVIDERS.length} providers, mapped to the 7-stage translation pipeline
        </p>

        <div style={{ display: "flex", gap: 10, marginTop: 14, flexWrap: "wrap", alignItems: "center" }}>
          <input
            type="text"
            placeholder="Search tool name..."
            value={query}
            onChange={(e) => setQuery(e.target.value)}
            style={{
              fontFamily: "var(--sans)",
              fontSize: 12.5,
              padding: "6px 10px",
              border: "1px solid var(--rule)",
              borderRadius: 5,
              background: "#fff",
              color: "var(--ink)",
              width: 200,
              outline: "none",
            }}
          />

          <select
            value={providerFilter}
            onChange={(e) => setProviderFilter(e.target.value)}
            style={{
              fontFamily: "var(--sans)",
              fontSize: 12.5,
              padding: "6px 8px",
              border: "1px solid var(--rule)",
              borderRadius: 5,
              background: "#fff",
              color: "var(--ink)",
              outline: "none",
            }}
          >
            <option value="all">All providers</option>
            {PROVIDERS.map((p) => (
              <option key={p} value={p}>
                {p} ({TOOLS.filter((t) => t.provider === p).length})
              </option>
            ))}
          </select>

          <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12.5, color: "var(--ink-soft)", cursor: "pointer" }}>
            <input
              type="checkbox"
              checked={groupByProvider}
              onChange={(e) => setGroupByProvider(e.target.checked)}
            />
            Group by provider
          </label>

          <div style={{ display: "flex", border: "1px solid var(--rule)", borderRadius: 5, overflow: "hidden" }}>
            {["relaxed", "compact"].map((d) => (
              <button
                key={d}
                onClick={() => setDensity(d)}
                aria-pressed={density === d}
                style={{
                  fontFamily: "var(--sans)",
                  fontSize: 12,
                  padding: "5px 10px",
                  border: "none",
                  background: density === d ? "var(--connector)" : "transparent",
                  color: density === d ? "#fff" : "var(--ink-soft)",
                  cursor: "pointer",
                }}
              >
                {d === "relaxed" ? "Relaxed" : "Compact"}
              </button>
            ))}
          </div>

          {(query || stageFilter.size > 0 || providerFilter !== "all") && (
            <button
              onClick={() => { setQuery(""); setStageFilter(new Set()); setProviderFilter("all"); }}
              style={{
                fontFamily: "var(--sans)",
                fontSize: 12,
                color: "var(--ink-soft)",
                background: "none",
                border: "1px solid var(--rule)",
                borderRadius: 5,
                padding: "5px 10px",
                cursor: "pointer",
              }}
            >
              Clear filters
            </button>
          )}

          <span style={{ fontSize: 11.5, color: "var(--ink-faint)", marginLeft: "auto", fontFamily: "var(--mono)" }}>
            {filtered.length} shown
          </span>
        </div>
      </div>

      <div ref={tableRef} style={{ overflowX: "auto" }}>
        <div style={{ minWidth: colLabelW + STAGES.length * colW, position: "relative" }}>
          <ColumnHighlights stageFilter={stageFilter} colLabelW={colLabelW} colW={colW} />
          <StageHeader stageFilter={stageFilter} toggleStage={toggleStage} stageCounts={stageCounts} colLabelW={colLabelW} colW={colW} />

          {filtered.length === 0 && (
            <div style={{ padding: "40px 20px", textAlign: "center", color: "var(--ink-faint)", fontSize: 13 }}>
              No tools match the current filters.
            </div>
          )}

          {groupByProvider
            ? grouped.map(([provider, tools]) => (
                // Note: "provider" here is the display group key — either a real
                // provider name or INDEPENDENT_LABEL for the collapsed bucket.
                <ProviderGroup
                  key={provider}
                  provider={provider}
                  tools={tools}
                  defaultCollapsed={provider === "SIL" || provider === INDEPENDENT_LABEL}
                  openRows={openRows}
                  toggleRow={toggleRow}
                  colLabelW={colLabelW}
                  colW={colW}
                  rowH={rowH}
                  compact={isCompact}
                />
              ))
            : filtered.map((tool) => (
                <ToolRow
                  key={tool.id}
                  tool={tool}
                  isOpen={!!openRows[tool.id]}
                  onToggle={() => toggleRow(tool.id)}
                  highlight={false}
                  colLabelW={colLabelW}
                  colW={colW}
                  rowH={rowH}
                  compact={isCompact}
                />
              ))}
        </div>
      </div>

      <div
        style={{
          padding: "10px 20px",
          borderTop: "1px solid var(--rule)",
          fontSize: 11,
          color: "var(--ink-faint)",
          display: "flex",
          gap: 16,
        }}
      >
        <span>&#9679; single-stage tool</span>
        <span>&#9679;&#8212;&#9679; contiguous stage span</span>
        <span>&#9679; &nbsp; &#9679; non-contiguous stages (separate dots)</span>
      </div>
    </div>
  );
}

try {
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(React.createElement(ToolLandscape));
  // Auto-height: notify parent of content height after render
  function sendHeight() {
    const h = document.documentElement.scrollHeight;
    if (window.parent !== window) window.parent.postMessage({ type: 'landscape-height', height: h }, '*');
  }
  setTimeout(sendHeight, 300);
  new ResizeObserver(sendHeight).observe(document.getElementById('root'));
} catch (e) {
  showError('Failed to render component: ' + e.message, e.stack);
}
</script>

</body>
</html>
